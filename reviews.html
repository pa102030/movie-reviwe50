<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies World - Search & Reviews</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
        }

        /* HEADER & SEARCH BAR */
        header {
            padding: 20px;
            background-color: #121212;
            border-bottom: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .app-title {
            color: #e50914;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #1f1f1f;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-input:focus {
            border-color: #e50914;
        }
        .search-results-dropdown {
            position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            background: #181818;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #252525;
        }
        .dropdown-item:hover {
            background-color: #252525;
        }
        .dropdown-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* MAIN HOME / REVIEWS SECTION */
        #homePage {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #e50914;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .review-card {
            background-color: #161616;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #262626;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .review-card:hover {
            transform: translateY(-4px);
            border-color: #e50914;
            background-color: #1f1f1f;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card-genre {
            color: #e50914;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }
        .card-text {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* MOVIE DETAILS PAGE (EXACT SCREENSHOT LAYOUT) */
        #detailsPage {
            display: none;
            position: relative;
            min-height: 90vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(11, 11, 11, 0.8) 0%, rgba(11, 11, 11, 0.95) 80%, #0b0b0b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 20px;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }
        .back-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }
        .content-box {
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
        }
        .poster-wrapper {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 2/3;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            background-color: #1f1f1f;
        }
        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-title {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .tagline {
            font-size: 1.05rem;
            color: #b3b3b3;
            font-style: italic;
            margin-bottom: 20px;
        }
        .meta-pills {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .rating {
            color: #ffcc00;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .rating-max {
            color: #777;
            font-weight: 400;
        }
        .pill {
            background-color: rgba(255, 255, 255, 0.15);
            color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .pill-gold {
            border: 1px solid #f5c518;
            color: #f5c518;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .genre-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .genre-badge {
            background-color: #990000;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .trailer-btn {
            display: inline-block;
            background-color: #e50914;
            color: #fff;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .trailer-btn:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <!-- HEADER / SEARCH -->
    <header>
        <h1 class="app-title" onclick="showHomePage()">Movies World</h1>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search any movie..." oninput="handleSearch()">
            <div id="dropdown" class="search-results-dropdown" style="display: none;"></div>
        </div>
    </header>

    <!-- HOME / REVIEWS LIST -->
    <div id="homePage">
        <h2 class="section-title">Latest Reviews</h2>
        <div class="reviews-grid" id="reviewsContainer"></div>
    </div>

    <!-- MOVIE DETAILS PAGE (DIRECT FROM API) -->
    <div id="detailsPage">
        <button class="back-btn" onclick="showHomePage()">← Back</button>
        <div class="overlay">
            <div class="content-box">
                <div class="poster-wrapper">
                    <img id="posterImg" src="" alt="Poster">
                </div>
                <h1 class="movie-title" id="movieTitle">Loading...</h1>
                <p class="tagline" id="tagline"></p>
                
                <div class="meta-pills">
                    <div class="rating">★ <span id="ratingVal">--</span> <span class="rating-max">/10</span></div>
                    <span class="pill" id="yearVal">----</span>
                    <span class="pill" id="runtimeVal">-- min</span>
                    <span class="pill" id="pgVal">PG-13</span>
                    <span class="pill-gold">4K</span>
                </div>

                <div class="genre-row" id="genreContainer"></div>

                <div>
                    <a id="trailerBtn" href="#" target="_blank" class="trailer-btn">▶ Watch Trailer</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '8ee66710f2f840fe7b6a29bc84db0629';

        // Reviews array connected with real TMDB IDs
        const movieReviews = [
            { tmdbId: 361743, title: "Top Gun: Maverick", review: "An adrenaline-pumping experience best enjoyed on the biggest screen possible." },
            { tmdbId: 27205, title: "Inception", review: "A mind-bending cinematic experience that dives deep into the sub-conscious." },
            { tmdbId: 155, title: "The Dark Knight", review: "An absolute masterclass in superhero cinema with an iconic performance." },
            { tmdbId: 157336, title: "Interstellar", review: "A breathtaking fusion of complex science and emotional storytelling." },
            { tmdbId: 245891, title: "John Wick", review: "A game-changer for the gun-fu action genre with relentless fight choreography." },
            { tmdbId: 693134, title: "Dune: Part Two", review: "A modern masterpiece of visual and sound design that sets a new benchmark." }
        ];

        // Render Reviews list on Home Page
        const reviewsContainer = document.getElementById('reviewsContainer');
        movieReviews.forEach(item => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.onclick = () => loadMovieDetails(item.tmdbId);
            card.innerHTML = `
                <h3 class="card-title">${item.title}</h3>
                <span class="card-genre">Review</span>
                <p class="card-text">"${item.review}"</p>
            `;
            reviewsContainer.appendChild(card);
        });

        // Search Bar logic via TMDB API
        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const dropdown = document.getElementById('dropdown');

            if (query.length < 2) {
                dropdown.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                dropdown.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    dropdown.style.display = 'block';
                    data.results.slice(0, 6).forEach(movie => {
                        const item = document.createElement('div');
                        item.className = 'dropdown-item';
                        item.onclick = () => {
                            dropdown.style.display = 'none';
                            document.getElementById('searchInput').value = '';
                            loadMovieDetails(movie.id);
                        };
                        const posterPath = movie.poster_path ? `https://image.tmdb.org/t/p/w92${movie.poster_path}` : 'https://via.placeholder.com/40x60';
                        item.innerHTML = `
                            <img src="${posterPath}" alt="Poster">
                            <div>
                                <div style="font-weight: bold; font-size: 0.95rem;">${movie.title}</div>
                                <div style="font-size: 0.8rem; color: #888;">${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</div>
                            </div>
                        `;
                        dropdown.appendChild(item);
                    });
                } else {
                    dropdown.style.display = 'none';
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        // FETCH & OPEN MOVIE DETAILS (Works for both Search Results & Review clicks)
        async function loadMovieDetails(movieId) {
            document.getElementById('homePage').style.display = 'none';
            const detailsPage = document.getElementById('detailsPage');
            detailsPage.style.display = 'block';
            window.scrollTo(0, 0);

            // Reset UI Loading
            document.getElementById('movieTitle').innerText = "Loading...";
            document.getElementById('tagline').innerText = "";
            document.getElementById('posterImg').src = "";

            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API_KEY}&append_to_response=videos`);
                const movie = await res.json();

                // Fill Movie Data
                document.getElementById('movieTitle').innerText = movie.title || "Untitled";
                document.getElementById('tagline').innerText = movie.tagline || movie.overview || "";
                document.getElementById('ratingVal').innerText = movie.vote_average ? movie.vote_average.toFixed(1) : "N/A";
                document.getElementById('yearVal').innerText = movie.release_date ? movie.release_date.split('-')[0] : "----";
                document.getElementById('runtimeVal').innerText = movie.runtime ? `${movie.runtime} min` : "N/A";
                
                // Poster & Backdrop Image URLs
                if (movie.poster_path) {
                    document.getElementById('posterImg').src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                }
                if (movie.backdrop_path) {
                    detailsPage.style.backgroundImage = `url('https://image.tmdb.org/t/p/original${movie.backdrop_path}')`;
                }

                // Genres Badges
                const genreContainer = document.getElementById('genreContainer');
                genreContainer.innerHTML = '';
                if (movie.genres) {
                    movie.genres.forEach(g => {
                        const badge = document.createElement('span');
                        badge.className = 'genre-badge';
                        badge.innerText = g.name;
                        genreContainer.appendChild(badge);
                    });
                }

                // Youtube Trailer Link
                const trailer = movie.videos && movie.videos.results ? movie.videos.results.find(vid => vid.type === 'Trailer' && vid.site === 'YouTube') : null;
                const trailerBtn = document.getElementById('trailerBtn');
                if (trailer) {
                    trailerBtn.href = `https://www.youtube.com/watch?v=${trailer.key}`;
                } else {
                    trailerBtn.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title)}+trailer`;
                }

            } catch (err) {
                console.error("API Fetch Error:", err);
            }
        }

        function showHomePage() {
            document.getElementById('detailsPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
