<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies World - Reviews & Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ----- REVIEWS PAGE STYLES ----- */
        #reviewsPage {
            padding: 20px;
        }
        h1.page-title {
            text-align: center;
            margin: 20px 0 30px;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .reviews-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .review-card {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #e50914;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }
        .review-card:hover {
            transform: translateY(-5px);
            background-color: #282828;
        }
        .movie-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .genre-badge {
            display: inline-block;
            background-color: #333;
            color: #e50914;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .review-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
        }

        /* ----- MOVIE DETAILS PAGE STYLES ----- */
        #detailsPage {
            display: none;
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .back-btn:hover {
            background-color: #e50914;
            border-color: #e50914;
        }
        .hero-banner {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            transition: background-image 0.4s ease-in-out;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #0d0d0d 20%, rgba(13, 13, 13, 0.6) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin-bottom: 20px;
        }
        .badge {
            background-color: #e50914;
            color: #fff;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .detail-title {
            font-size: 3rem;
            margin: 15px 0;
            font-weight: 800;
            line-height: 1.1;
        }
        .meta-info {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 20px;
        }
        .rating {
            color: #f5c518;
            font-weight: bold;
        }
        .quality-badge {
            border: 1px solid #777;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        .overview {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-red {
            background-color: #e50914;
            color: #fff;
        }
        .btn-outline {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }
        .btn-yellow {
            background-color: #f5c518;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- REVIEWS PAGE -->
    <div id="reviewsPage">
        <h1 class="page-title">Movie Reviews Collection</h1>
        <div class="reviews-container" id="reviewsContainer"></div>
    </div>

    <!-- MOVIE DETAILS PAGE -->
    <div id="detailsPage">
        <button class="back-btn" onclick="showReviewsList()">← Back to Reviews</button>
        <div class="hero-banner" id="heroBanner">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="badge" id="badge">FEATURED</span>
                <h1 class="detail-title" id="movieTitle">Loading...</h1>
                <div class="meta-info">
                    <span class="rating" id="rating">★ --/10</span>
                    <span id="releaseYear">----</span>
                    <span class="quality-badge" id="genres">--</span>
                </div>
                <p class="overview" id="overview">Loading movie details...</p>
                <div class="btn-group">
                    <button class="btn btn-red">📖 Read Review</button>
                    <button class="btn btn-outline" id="trailerBtn">▶ Watch Trailer</button>
                    <button class="btn btn-yellow">📺 Watch / Buy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TMDB API Key Included Directly
        const API_KEY = '8ee66710f2f840fe7b6a29bc84db0629';

        const movieReviews = [
            { id: 27205, title: "Inception", genre: "Action / Sci-Fi", review: "A mind-bending cinematic experience that dives deep into the sub-conscious. Stunning visual effects and Hans Zimmer's haunting score make it an absolute masterpiece that leaves you questioning reality." },
            { id: 76341, title: "Mad Max: Fury Road", genre: "Action / Sci-Fi", review: "A non-stop high-octane action spectacle. A prime example of how to tell a compelling story purely through relentless cinematic action without wasting a single second." },
            { id: 245891, title: "John Wick", genre: "Action / Thriller", review: "A game-changer for the gun-fu action genre. Keanu Reeves delivers an iconic performance backed by stylish cinematography and relentless fight choreography." },
            { id: 155, title: "The Dark Knight", genre: "Action / Crime", review: "An absolute masterclass in superhero cinema. Heath Ledger's legendary performance as the Joker steals the show and elevates the entire film into a timeless masterpiece." },
            { id: 361743, title: "Top Gun: Maverick", genre: "Action / Drama", review: "The perfect sequel that seamlessly blends nostalgia with cutting-edge real jet aerial sequences. An adrenaline-pumping experience best enjoyed on the biggest screen possible." },
            { id: 98, title: "Gladiator", genre: "Action / Drama", review: "An epic tale of vengeance, honor, and redemption. Russell Crowe gives a powerful performance, perfectly complemented by Hans Zimmer’s emotional soundtrack." },
            { id: 299534, title: "Avengers: Endgame", genre: "Action / Sci-Fi", review: "A deeply satisfying and emotional conclusion to a decade-long cinematic journey. Gives every core character their fitting moment to shine." },
            { id: 36557, title: "Casino Royale", genre: "Action / Thriller", review: "A gritty, grounded reboot that successfully redefined James Bond. Daniel Craig captivated audiences right from his debut with raw intensity." },
            { id: 353081, title: "Mission: Impossible - Fallout", genre: "Action / Thriller", review: "Tom Cruise proves why he is a true cinema icon. The real, jaw-dropping stunts deliver a level of suspense and thrill that CGI can never replicate." },
            { id: 603, title: "The Matrix", genre: "Action / Sci-Fi", review: "A revolutionary milestone in film history. Blends philosophical questions with ground-breaking visual effects and iconic action sequences." },
            { id: 157336, title: "Interstellar", genre: "Sci-Fi / Drama", review: "A breathtaking fusion of complex science, deep space exploration, and emotional father-daughter love. Christopher Nolan's finest cinematic poem." },
            { id: 1124, title: "The Prestige", genre: "Sci-Fi / Mystery", review: "A brilliant story about obsession that keeps you in the dark until the final frame. The final twist leaves you completely speechless." },
            { id: 329865, title: "Arrival", genre: "Sci-Fi / Drama", review: "Proves that Sci-Fi isn't just about explosions and alien wars, but about empathy, communication, and human connection. Deeply emotional and thought-provoking." },
            { id: 335984, title: "Blade Runner 2049", genre: "Sci-Fi / Mystery", review: "Every single frame looks like a fine art painting. Slowly paced, yet its immersive sound design and visual world pull you completely into another reality." },
            { id: 11324, title: "Shutter Island", genre: "Psychological Thriller", review: "A psychological maze that plays tricks on your mind. Scorsese creates a chilling atmosphere that leaves you questioning what is real until the very end." },
            { id: 545611, title: "Everything Everywhere All at Once", genre: "Sci-Fi / Comedy", review: "An insanely creative, heartwarming, and chaotic journey through the multiverse. Completely unique and wildly entertaining from start to finish." },
            { id: 693134, title: "Dune: Part Two", genre: "Sci-Fi / Adventure", review: "A modern masterpiece of visual and sound design. Sets a new benchmark for how realistic and immersive a sci-fi world can be built on screen." },
            { id: 264660, title: "Ex Machina", genre: "Sci-Fi / Drama", review: "A slick, tense, and thought-provoking look at the dark side of AI and human manipulation. Simple setting, but intensely gripping execution." },
            { id: 220289, title: "Coherence", genre: "Sci-Fi / Mystery", review: "Proof that you don't need a massive budget to make a mind-blowing film. A dinner party turns into a terrifying multiverse puzzle." },
            { id: 577922, title: "Tenet", genre: "Sci-Fi / Action", review: "Complex and hard to grasp on the first watch, but the time-inversion concept and booming soundtrack make it an unforgettable ride." }
        ];

        const container = document.getElementById('reviewsContainer');

        movieReviews.forEach(item => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.onclick = () => openMovieDetails(item.id, item.review);

            card.innerHTML = `
                <h3 class="movie-title">${item.title}</h3>
                <span class="genre-badge">${item.genre}</span>
                <p class="review-text">"${item.review}"</p>
            `;
            container.appendChild(card);
        });

        async function openMovieDetails(id, localReview) {
            document.getElementById('reviewsPage').style.display = 'none';
            document.getElementById('detailsPage').style.display = 'block';
            window.scrollTo(0, 0);

            document.getElementById('movieTitle').innerText = "Loading...";
            document.getElementById('overview').innerText = "Fetching details from TMDB...";

            try {
                const response = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&append_to_response=videos`);
                
                if (!response.ok) {
                    throw new Error("Failed to fetch movie details.");
                }

                const movie = await response.json();

                document.getElementById('movieTitle').innerText = movie.title || "Untitled";
                document.getElementById('overview').innerText = movie.overview || localReview;
                document.getElementById('rating').innerText = `★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}/10`;
                document.getElementById('releaseYear').innerText = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                document.getElementById('genres').innerText = movie.genres && movie.genres.length > 0 ? movie.genres[0].name : '4K';

                if (movie.backdrop_path) {
                    document.getElementById('heroBanner').style.backgroundImage = `url('https://image.tmdb.org/t/p/original${movie.backdrop_path}')`;
                } else {
                    document.getElementById('heroBanner').style.backgroundImage = 'none';
                }

                const trailer = movie.videos && movie.videos.results ? movie.videos.results.find(vid => vid.type === 'Trailer' && vid.site === 'YouTube') : null;
                const trailerBtn = document.getElementById('trailerBtn');
                if (trailer) {
                    trailerBtn.onclick = () => window.open(`https://www.youtube.com/watch?v=${trailer.key}`, '_blank');
                } else {
                    trailerBtn.onclick = () => alert("Trailer not available for this movie.");
                }

            } catch (error) {
                console.error("API Fetch Error:", error);
                document.getElementById('movieTitle').innerText = "Details Loaded (Offline)";
                document.getElementById('overview').innerText = localReview;
            }
        }

        function showReviewsList() {
            document.getElementById('detailsPage').style.display = 'none';
            document.getElementById('reviewsPage').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
