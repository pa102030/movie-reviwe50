<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies World - Reviews & Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ----- REVIEWS LIST PAGE ----- */
        #reviewsPage {
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1.page-title {
            text-align: center;
            margin-bottom: 30px;
            color: #e50914;
            letter-spacing: 1px;
        }
        .reviews-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .review-card {
            background-color: #161616;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #262626;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .review-card:hover {
            transform: translateY(-4px);
            border-color: #e50914;
            background-color: #1f1f1f;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card-genre {
            color: #e50914;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }
        .card-text {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* ----- DETAILS PAGE (EXACT SCREENSHOT LAYOUT) ----- */
        #detailsPage {
            display: none;
            position: relative;
            min-height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(11, 11, 11, 0.75) 0%, rgba(11, 11, 11, 0.95) 80%, #0b0b0b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 20px;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }
        .back-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }

        /* MATCHING EXACT LAYOUT IN YOUR IMAGE */
        .content-box {
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
        }
        .poster-wrapper {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 2/3;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin-bottom: 25px;
        }
        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .movie-title {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .tagline {
            font-size: 1.05rem;
            color: #b3b3b3;
            font-style: italic;
            margin-bottom: 20px;
        }
        .meta-pills {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .rating {
            color: #ffcc00;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .rating-max {
            color: #777;
            font-weight: 400;
        }
        .pill {
            background-color: rgba(255, 255, 255, 0.15);
            color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .pill-gold {
            border: 1px solid #f5c518;
            color: #f5c518;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .genre-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .genre-badge {
            background-color: #990000;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 18px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .trailer-btn {
            display: inline-block;
            background-color: #e50914;
            color: #fff;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .trailer-btn:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <!-- REVIEWS LIST PAGE -->
    <div id="reviewsPage">
        <h1 class="page-title">Movie Reviews</h1>
        <div class="reviews-container" id="reviewsContainer"></div>
    </div>

    <!-- MOVIE DETAILS PAGE (EXACT DESIGN MATCH) -->
    <div id="detailsPage">
        <button class="back-btn" onclick="showReviewsList()">← Back</button>
        <div class="overlay">
            <div class="content-box">
                <div class="poster-wrapper">
                    <img id="posterImg" src="" alt="Poster">
                </div>
                <h1 class="movie-title" id="movieTitle">Top Gun: Maverick</h1>
                <p class="tagline" id="tagline">Feel the need... The need for speed.</p>
                
                <div class="meta-pills">
                    <div class="rating">★ <span id="ratingVal">8.2</span> <span class="rating-max">/10</span></div>
                    <span class="pill" id="yearVal">2022</span>
                    <span class="pill" id="runtimeVal">131 min</span>
                    <span class="pill" id="pgVal">PG-13</span>
                    <span class="pill-gold">4K</span>
                </div>

                <div class="genre-row" id="genreContainer"></div>

                <div>
                    <a id="trailerBtn" href="#" target="_blank" class="trailer-btn">▶ Watch Trailer</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const moviesData = [
            {
                id: 1,
                title: "Top Gun: Maverick",
                tagline: "Feel the need... The need for speed.",
                rating: "8.2",
                year: "2022",
                runtime: "131 min",
                pg: "PG-13",
                genres: ["Action", "Drama"],
                poster: "https://image.tmdb.org/t/p/w500/628Dep6AxEtA32L2C80491L8Y8.jpg",
                backdrop: "https://image.tmdb.org/t/p/original/AaV1YIdWKnjA92923C2L8L_8eL.jpg",
                trailer: "https://www.youtube.com/watch?v=giXco2jaZ_4",
                review: "The perfect sequel that seamlessly blends nostalgia with cutting-edge real jet aerial sequences."
            },
            {
                id: 2,
                title: "Inception",
                tagline: "Your mind is the scene of the crime.",
                rating: "8.8",
                year: "2010",
                runtime: "148 min",
                pg: "PG-13",
                genres: ["Action", "Sci-Fi"],
                poster: "https://image.tmdb.org/t/p/w500/oYuLE1311oA8h3M291o2A31o3.jpg",
                backdrop: "https://image.tmdb.org/t/p/original/8ZTVqvKDQ8emSGUEMjsS4yHA34p.jpg",
                trailer: "https://www.youtube.com/watch?v=YoHD9XEInc0",
                review: "A mind-bending cinematic experience that dives deep into the sub-conscious."
            }
        ];

        const container = document.getElementById('reviewsContainer');

        // Render Review Cards
        moviesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.onclick = () => openMovieDetails(item);

            card.innerHTML = `
                <h3 class="card-title">${item.title}</h3>
                <span class="card-genre">${item.genres.join(' / ')}</span>
                <p class="card-text">"${item.review}"</p>
            `;
            container.appendChild(card);
        });

        // Open exact details page when clicked
        function openMovieDetails(movie) {
            document.getElementById('reviewsPage').style.display = 'none';
            const detailsPage = document.getElementById('detailsPage');
            detailsPage.style.display = 'block';
            detailsPage.style.backgroundImage = `url('${movie.backdrop}')`;

            document.getElementById('posterImg').src = movie.poster;
            document.getElementById('movieTitle').innerText = movie.title;
            document.getElementById('tagline').innerText = movie.tagline;
            document.getElementById('ratingVal').innerText = movie.rating;
            document.getElementById('yearVal').innerText = movie.year;
            document.getElementById('runtimeVal').innerText = movie.runtime;
            document.getElementById('pgVal').innerText = movie.pg;
            document.getElementById('trailerBtn').href = movie.trailer;

            const genreContainer = document.getElementById('genreContainer');
            genreContainer.innerHTML = '';
            movie.genres.forEach(g => {
                const badge = document.createElement('span');
                badge.className = 'genre-badge';
                badge.innerText = g;
                genreContainer.appendChild(badge);
            });

            window.scrollTo(0, 0);
        }

        function showReviewsList() {
            document.getElementById('detailsPage').style.display = 'none';
            document.getElementById('reviewsPage').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
