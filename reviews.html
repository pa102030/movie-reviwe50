<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies World - Reviews & Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ----- REVIEWS LIST PAGE ----- */
        #reviewsPage {
            padding: 20px;
        }
        h1.page-title {
            text-align: center;
            margin: 20px 0 30px;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .reviews-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .review-card {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #e50914;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }
        .review-card:hover {
            transform: translateY(-5px);
            background-color: #282828;
        }
        .card-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .card-genre {
            display: inline-block;
            background-color: #333;
            color: #e50914;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .card-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
        }

        /* ----- MOVIE DETAILS PAGE (EXACT DESIGN MATCH) ----- */
        #detailsPage {
            display: none;
            position: relative;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .back-btn:hover {
            background-color: #e50914;
            border-color: #e50914;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(13, 13, 13, 0.95) 35%, rgba(13, 13, 13, 0.65) 100%),
                        linear-gradient(to top, #0d0d0d 10%, transparent 100%);
            display: flex;
            align-items: center;
            padding: 50px 8%;
        }
        .details-wrapper {
            display: flex;
            gap: 40px;
            align-items: center;
            max-width: 1100px;
            z-index: 2;
            flex-wrap: wrap;
        }
        .poster-card {
            width: 280px;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
        }
        .poster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-section {
            max-width: 650px;
        }
        .movie-heading {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .tagline {
            font-style: italic;
            font-size: 1.2rem;
            color: #bbb;
            margin-bottom: 25px;
        }
        .pills-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .pill {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ddd;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .pill-rating {
            color: #f5c518;
            background-color: transparent;
            padding: 0;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .pill-gold {
            border: 1px solid #f5c518;
            color: #f5c518;
            background: transparent;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        .genre-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tag-red {
            background-color: #8b0000;
            color: #ffcccc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .btn-play {
            background-color: #e50914;
            color: #fff;
            padding: 12px 26px;
            border-radius: 25px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
        }
        .btn-play:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <!-- REVIEWS LIST -->
    <div id="reviewsPage">
        <h1 class="page-title">Movie Reviews</h1>
        <div class="reviews-container" id="reviewsContainer"></div>
    </div>

    <!-- MOVIE DETAILS (MATCHING YOUR SCREENSHOT EXACTLY) -->
    <div id="detailsPage">
        <button class="back-btn" onclick="showReviewsList()">← Back</button>
        <div class="hero-overlay">
            <div class="details-wrapper">
                <div class="poster-card">
                    <img id="posterImg" src="" alt="Movie Poster">
                </div>
                <div class="info-section">
                    <h1 class="movie-heading" id="detailTitle">Top Gun: Maverick</h1>
                    <p class="tagline" id="detailTagline">Feel the need... The need for speed.</p>
                    
                    <div class="pills-row">
                        <span class="pill-rating" id="detailRating">★ 8.2 <span style="color:#aaa; font-weight:normal;">/10</span></span>
                        <span class="pill" id="detailYear">2022</span>
                        <span class="pill" id="detailRuntime">131 min</span>
                        <span class="pill" id="detailPG">PG-13</span>
                        <span class="pill-gold">4K</span>
                    </div>

                    <div class="genre-tags" id="genreContainer"></div>

                    <div class="action-btns">
                        <a id="trailerBtn" href="#" target="_blank" class="btn-play">▶ Watch Trailer</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const moviesData = [
            {
                id: 361743,
                title: "Top Gun: Maverick",
                tagline: "Feel the need... The need for speed.",
                rating: "8.2",
                year: "2022",
                runtime: "131 min",
                pg: "PG-13",
                genres: ["Action", "Drama"],
                poster: "https://image.tmdb.org/t/p/w500/628Dep6AxEtA32L2C80491L8Y8.jpg",
                backdrop: "https://image.tmdb.org/t/p/original/AaV1YIdWKnjA92923C2L8L_8eL.jpg",
                trailer: "https://www.youtube.com/watch?v=giXco2jaZ_4",
                review: "The perfect sequel that seamlessly blends nostalgia with cutting-edge real jet aerial sequences."
            },
            {
                id: 27205,
                title: "Inception",
                tagline: "Your mind is the scene of the crime.",
                rating: "8.8",
                year: "2010",
                runtime: "148 min",
                pg: "PG-13",
                genres: ["Action", "Sci-Fi"],
                poster: "https://image.tmdb.org/t/p/w500/oYuLE1311oA8h3M291o2A31o3.jpg",
                backdrop: "https://image.tmdb.org/t/p/original/8ZTVqvKDQ8emSGUEMjsS4yHA34p.jpg",
                trailer: "https://www.youtube.com/watch?v=YoHD9XEInc0",
                review: "A mind-bending cinematic experience that dives deep into the sub-conscious."
            },
            {
                id: 245891,
                title: "John Wick",
                tagline: "Don't set him off.",
                rating: "7.4",
                year: "2014",
                runtime: "101 min",
                pg: "R",
                genres: ["Action", "Thriller"],
                poster: "https://image.tmdb.org/t/p/w500/fZAaw23J9f21R2f54uL23423.jpg",
                backdrop: "https://image.tmdb.org/t/p/original/umC043L8d23Atm93P93R41A933L.jpg",
                trailer: "https://www.youtube.com/watch?v=C0BMx-qxsP4",
                review: "A game-changer for the gun-fu action genre with stylish choreography."
            }
        ];

        const container = document.getElementById('reviewsContainer');

        // Render Cards
        moviesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.onclick = () => openMovieDetails(item);

            card.innerHTML = `
                <h3 class="card-title">${item.title}</h3>
                <span class="card-genre">${item.genres.join(' / ')}</span>
                <p class="card-text">"${item.review}"</p>
            `;
            container.appendChild(card);
        });

        // Open details matching exact design from image
        function openMovieDetails(movie) {
            document.getElementById('reviewsPage').style.display = 'none';
            const detailsPage = document.getElementById('detailsPage');
            detailsPage.style.display = 'block';
            detailsPage.style.backgroundImage = `url('${movie.backdrop}')`;

            document.getElementById('posterImg').src = movie.poster;
            document.getElementById('detailTitle').innerText = movie.title;
            document.getElementById('detailTagline').innerText = movie.tagline;
            document.getElementById('detailRating').innerHTML = `★ ${movie.rating} <span style="color:#aaa; font-weight:normal;">/10</span>`;
            document.getElementById('detailYear').innerText = movie.year;
            document.getElementById('detailRuntime').innerText = movie.runtime;
            document.getElementById('detailPG').innerText = movie.pg;
            document.getElementById('trailerBtn').href = movie.trailer;

            const genreContainer = document.getElementById('genreContainer');
            genreContainer.innerHTML = '';
            movie.genres.forEach(g => {
                const tag = document.createElement('span');
                tag.className = 'tag-red';
                tag.innerText = g;
                genreContainer.appendChild(tag);
            });

            window.scrollTo(0, 0);
        }

        function showReviewsList() {
            document.getElementById('detailsPage').style.display = 'none';
            document.getElementById('reviewsPage').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
