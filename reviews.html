<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies World - Reviews & Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ----- REVIEWS PAGE STYLES ----- */
        #reviewsPage {
            padding: 20px;
        }
        h1.page-title {
            text-align: center;
            margin: 20px 0 30px;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .reviews-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .review-card {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #e50914;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }
        .review-card:hover {
            transform: translateY(-5px);
            background-color: #282828;
        }
        .movie-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 8px;
        }
        .genre-badge {
            display: inline-block;
            background-color: #333;
            color: #e50914;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .review-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
        }

        /* ----- MOVIE DETAILS PAGE STYLES ----- */
        #detailsPage {
            display: none;
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .back-btn:hover {
            background-color: #e50914;
            border-color: #e50914;
        }
        .hero-banner {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            transition: background-image 0.3s ease-in-out;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #0d0d0d 20%, rgba(13, 13, 13, 0.6) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin-bottom: 20px;
        }
        .badge {
            background-color: #e50914;
            color: #fff;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .detail-title {
            font-size: 3rem;
            margin: 15px 0;
            font-weight: 800;
            line-height: 1.1;
        }
        .meta-info {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 20px;
        }
        .rating {
            color: #f5c518;
            font-weight: bold;
        }
        .quality-badge {
            border: 1px solid #777;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        .overview {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-red {
            background-color: #e50914;
            color: #fff;
        }
        .btn-outline {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }
        .btn-yellow {
            background-color: #f5c518;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- REVIEWS PAGE -->
    <div id="reviewsPage">
        <h1 class="page-title">Movie Reviews Collection</h1>
        <div class="reviews-container" id="reviewsContainer"></div>
    </div>

    <!-- MOVIE DETAILS PAGE -->
    <div id="detailsPage">
        <button class="back-btn" onclick="showReviewsList()">← Back to Reviews</button>
        <div class="hero-banner" id="heroBanner">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="badge" id="badge">FEATURED</span>
                <h1 class="detail-title" id="movieTitle">Loading...</h1>
                <div class="meta-info">
                    <span class="rating" id="rating">★ --/10</span>
                    <span id="releaseYear">----</span>
                    <span class="quality-badge">4K</span>
                </div>
                <p class="overview" id="overview">Loading details...</p>
                <div class="btn-group">
                    <button class="btn btn-red">📖 Read Review</button>
                    <button class="btn btn-outline" id="trailerBtn">▶ Watch Trailer</button>
                    <button class="btn btn-yellow">📺 Watch / Buy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const movieReviews = [
            { id: 27205, title: "Inception", genre: "Action / Sci-Fi", rating: "8.8", year: "2010", backdrop: "https://image.tmdb.org/t/p/original/8ZTVqvKDQ8emSGUEMjsS4yHA34p.jpg", review: "A mind-bending cinematic experience that dives deep into the sub-conscious. Stunning visual effects and Hans Zimmer's haunting score make it an absolute masterpiece that leaves you questioning reality." },
            { id: 76341, title: "Mad Max: Fury Road", genre: "Action / Sci-Fi", rating: "8.1", year: "2015", backdrop: "https://image.tmdb.org/t/p/original/8tZYtuWezp8R3Ut2Viy89vhLSuP.jpg", review: "A non-stop high-octane action spectacle. A prime example of how to tell a compelling story purely through relentless cinematic action without wasting a single second." },
            { id: 245891, title: "John Wick", genre: "Action / Thriller", rating: "7.4", year: "2014", backdrop: "https://image.tmdb.org/t/p/original/umC043L8d23Atm93P93R41A933L.jpg", review: "A game-changer for the gun-fu action genre. Keanu Reeves delivers an iconic performance backed by stylish cinematography and relentless fight choreography." },
            { id: 155, title: "The Dark Knight", genre: "Action / Crime", rating: "9.0", year: "2008", backdrop: "https://image.tmdb.org/t/p/original/nMK28193fR_N2vD4bJ6aB0988L.jpg", review: "An absolute masterclass in superhero cinema. Heath Ledger's legendary performance as the Joker steals the show and elevates the entire film into a timeless masterpiece." },
            { id: 361743, title: "Top Gun: Maverick", genre: "Action / Drama", rating: "8.3", year: "2022", backdrop: "https://image.tmdb.org/t/p/original/AaV1YIdWKnjA92923C2L8L_8eL.jpg", review: "The perfect sequel that seamlessly blends nostalgia with cutting-edge real jet aerial sequences. An adrenaline-pumping experience best enjoyed on the biggest screen possible." },
            { id: 98, title: "Gladiator", genre: "Action / Drama", rating: "8.5", year: "2000", backdrop: "https://image.tmdb.org/t/p/original/vI3a8M_9vF1179v4H1G4i898v3.jpg", review: "An epic tale of vengeance, honor, and redemption. Russell Crowe gives a powerful performance, perfectly complemented by Hans Zimmer’s emotional soundtrack." },
            { id: 299534, title: "Avengers: Endgame", genre: "Action / Sci-Fi", rating: "8.4", year: "2019", backdrop: "https://image.tmdb.org/t/p/original/7RyG193Az3B211786523.jpg", review: "A deeply satisfying and emotional conclusion to a decade-long cinematic journey. Gives every core character their fitting moment to shine." },
            { id: 36557, title: "Casino Royale", genre: "Action / Thriller", rating: "8.0", year: "2006", backdrop: "https://image.tmdb.org/t/p/original/q37s193a02795860.jpg", review: "A gritty, grounded reboot that successfully redefined James Bond. Daniel Craig captivated audiences right from his debut with raw intensity." },
            { id: 353081, title: "Mission: Impossible - Fallout", genre: "Action / Thriller", rating: "7.9", year: "2018", backdrop: "https://image.tmdb.org/t/p/original/aw422919532.jpg", review: "Tom Cruise proves why he is a true cinema icon. The real, jaw-dropping stunts deliver a level of suspense and thrill that CGI can never replicate." },
            { id: 603, title: "The Matrix", genre: "Action / Sci-Fi", rating: "8.7", year: "1999", backdrop: "https://image.tmdb.org/t/p/original/82405829.jpg", review: "A revolutionary milestone in film history. Blends philosophical questions with ground-breaking visual effects and iconic action sequences." }
        ];

        const container = document.getElementById('reviewsContainer');

        movieReviews.forEach(item => {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.onclick = () => openMovieDetails(item);

            card.innerHTML = `
                <h3 class="movie-title">${item.title}</h3>
                <span class="genre-badge">${item.genre}</span>
                <p class="review-text">"${item.review}"</p>
            `;
            container.appendChild(card);
        });

        function openMovieDetails(movie) {
            document.getElementById('reviewsPage').style.display = 'none';
            document.getElementById('detailsPage').style.display = 'block';
            window.scrollTo(0, 0);

            document.getElementById('movieTitle').innerText = movie.title;
            document.getElementById('overview').innerText = movie.review;
            document.getElementById('rating').innerText = `★ ${movie.rating} /10`;
            document.getElementById('releaseYear').innerText = movie.year;
            document.getElementById('badge').innerText = movie.genre;

            if (movie.backdrop) {
                document.getElementById('heroBanner').style.backgroundImage = `url('${movie.backdrop}')`;
            }

            document.getElementById('trailerBtn').onclick = () => {
                window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(movie.title)}+trailer`, '_blank');
            };
        }

        function showReviewsList() {
            document.getElementById('detailsPage').style.display = 'none';
            document.getElementById('reviewsPage').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
