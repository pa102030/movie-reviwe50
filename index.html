<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Explore Movies | MOVIES WORLD</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d12">
  <meta name="description" content="Browse movies by categories, pages, year and ratings on MOVIES WORLD.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e50914'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>M</text></svg>">
  
  <style>
    .movies-page-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .page-title {
      font-size: 28px;
      color: #fff;
      font-weight: 700;
    }
    
    /* Category Filter Buttons Styling */
    .category-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #e50914;
      border-color: #e50914;
      color: #fff;
    }

    /* Pagination Bar Styles */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 40px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .page-btn:hover {
      background: rgba(229, 9, 20, 0.2);
      border-color: #e50914;
      color: #fff;
    }
    .page-btn.active {
      background: #e50914;
      border-color: #e50914;
      color: #fff;
    }
    .page-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Header Language Dropdown */
    .nav-dropdown {
      position: relative;
      display: inline-block;
    }
    .nav-dropdown-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 7px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-dropdown-content {
      display: none;
      position: absolute;
      top: 110%;
      right: 0;
      background-color: #0f172a;
      min-width: 150px;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      z-index: 1000;
    }
    .nav-dropdown-content button {
      color: #cbd5e1;
      padding: 8px 14px;
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }
    .nav-dropdown-content button:hover {
      background-color: rgba(229, 9, 20, 0.15);
      color: #e50914;
    }
    .nav-dropdown:hover .nav-dropdown-content { display: block; }
    #google_translate_element { display: none; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark"><i class="fa-solid fa-clapperboard"></i></span>
        MOVIES<b>WORLD</b>
      </a>
      
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="movies.html" class="active">Movies</a>
        <a href="reviews.html">Reviews</a>
        <a href="genres.html">Genres</a>
        <a href="watchlist.html">Watchlist</a>
      </nav>

      <div class="header-actions">
        <!-- Language Switcher Dropdown -->
        <div class="nav-dropdown">
          <button class="nav-dropdown-btn">
            <i class="fa-solid fa-globe"></i> <span>Language</span> <i class="fa-solid fa-chevron-down" style="font-size:10px;"></i>
          </button>
          <div class="nav-dropdown-content">
            <button onclick="changeLanguage('en')">English</button>
            <button onclick="changeLanguage('si')">Sinhala (සිංහල)</button>
            <button onclick="changeLanguage('ta')">Tamil (தமிழ்)</button>
            <button onclick="changeLanguage('hi')">Hindi (हिंदी)</button>
            <button onclick="changeLanguage('es')">Spanish (Español)</button>
            <button onclick="changeLanguage('fr')">French (Français)</button>
          </div>
        </div>

        <button class="icon-btn" data-open-search><i class="fa-solid fa-magnifying-glass"></i></button>
        <a href="watchlist.html" class="btn-profile"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
      </div>
    </div>
  </header>

  <div id="google_translate_element"></div>

  <main class="movies-page-container">
    <div class="page-header">
      <h1 class="page-title">Explore Movies</h1>
    </div>

    <!-- Category Selector Tabs -->
    <div class="category-bar">
      <button class="cat-btn active" onclick="filterCategory('all', this)">All Movies</button>
      <button class="cat-btn" onclick="filterCategory('28', this)">Action</button>
      <button class="cat-btn" onclick="filterCategory('35', this)">Comedy</button>
      <button class="cat-btn" onclick="filterCategory('18', this)">Drama</button>
      <button class="cat-btn" onclick="filterCategory('27', this)">Horror</button>
      <button class="cat-btn" onclick="filterCategory('878', this)">Sci-Fi</button>
      <button class="cat-btn" onclick="filterCategory('10749', this)">Romance</button>
      <button class="cat-btn" onclick="filterCategory('16', this)">Animation</button>
      <button class="cat-btn" onclick="filterCategory('53', this)">Thriller</button>
    </div>

    <!-- Movies Grid Display Container -->
    <div id="movies-grid" class="movies-grid"></div>

    <!-- Pagination Controls (Page 1, 2, 3...) -->
    <div class="pagination-container" id="pagination">
      <button class="page-btn" id="prev-btn" onclick="goToPage(currentPage - 1)"><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <div id="page-numbers" style="display: flex; gap: 6px;"></div>
      <button class="page-btn" id="next-btn" onclick="goToPage(currentPage + 1)">Next <i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-bottom">
        <span>© 2026 MOVIES WORLD. All rights reserved.</span>
        <span><a href="terms.html" style="color:#cbd5e1;">Terms of Service</a> · <a href="privacy.html" style="color:#cbd5e1;">Privacy Policy</a></span>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  
  <script>
    let currentPage = 1;
    let currentCategory = 'all';
    const totalPages = 500;

    function renderPagination() {
      const pageNumbersContainer = document.getElementById("page-numbers");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");

      pageNumbersContainer.innerHTML = "";

      if (currentPage === 1) {
        prevBtn.classList.add("disabled");
      } else {
        prevBtn.classList.remove("disabled");
      }

      if (currentPage === totalPages) {
        nextBtn.classList.add("disabled");
      } else {
        nextBtn.classList.remove("disabled");
      }

      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, currentPage + 2);

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
        btn.innerText = i;
        btn.onclick = () => goToPage(i);
        pageNumbersContainer.appendChild(btn);
      }
    }

    function goToPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderPagination();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // API call using currentPage and currentCategory
    }

    function filterCategory(catId, btnElement) {
      currentCategory = catId;
      currentPage = 1; // Category එකක් වෙනස් කළ විට නැවත Page 1 ට යයි
      
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      renderPagination();
      // API call using selected category
    }

    document.addEventListener("DOMContentLoaded", function() {
      renderPagination();
    });

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
    }

    function changeLanguage(langCode) {
      document.cookie = "googtrans=/en/" + langCode + "; path=/; domain=" + window.location.hostname;
      document.cookie = "googtrans=/en/" + langCode + "; path=/";
      window.location.reload();
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
