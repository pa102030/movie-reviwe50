<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>MOVIES WORLD | Explore Movies</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0a0d12;
      color: #fff;
      padding: 20px;
    }

    /* Movie Grid Styling */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .movie-card {
      background: #151f2e;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      padding-top: 150%; /* 2:3 aspect ratio */
      background: #0f172a;
    }

    .poster-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-quality {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #e50914;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-rating {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #f5c518;
      color: #f5c518;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Pagination Styling */
    .pagination-wrapper {
      text-align: center;
      margin-top: 40px;
    }

    .page-status {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .pagination-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .page-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .page-btn:hover {
      background: #334155;
      color: #fff;
    }

    .page-btn.active {
      background: #e50914;
      border-color: #e50914;
      color: #fff;
    }

    .page-btn.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Movies Display Grid -->
  <div class="movies-grid" id="movies-grid"></div>

  <!-- Pagination Controls -->
  <div class="pagination-wrapper">
    <div class="page-status" id="page-status">Page 1 of 500</div>
    <div class="pagination-container">
      <button class="page-btn" id="prev-btn" onclick="changePage(currentPage - 1)"><i class="fa-solid fa-chevron-left"></i></button>
      <div id="page-numbers" style="display: flex; gap: 8px;"></div>
      <button class="page-btn" id="next-btn" onclick="changePage(currentPage + 1)"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <script>
    // TMDB API Details
    const API_KEY = 'YOUR_TMDB_API_KEY'; // Yahan apni TMDB API Key dalein
    let currentPage = 1;
    const totalPages = 500; 

    // Function to Fetch Movies from TMDB API
    async function fetchMovies(page) {
      const grid = document.getElementById('movies-grid');
      grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Loading movies...</p>';

      try {
        const response = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US&page=${page}`);
        const data = await response.json();
        
        displayMovies(data.results);
      } catch (error) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #ef4444;">Failed to load movies. Check API Key.</p>';
      }
    }

    // Function to Render Movie Cards
    function displayMovies(movies) {
      const grid = document.getElementById('movies-grid');
      grid.innerHTML = '';

      movies.forEach(movie => {
        const poster = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
        const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
        const year = movie.release_date ? movie.release_date.split('-')[0] : '';

        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="poster-wrapper">
            <span class="badge-quality">WEB-DL</span>
            <span class="badge-rating"><i class="fa-solid fa-star"></i> ${rating}</span>
            <img src="${poster}" alt="${movie.title}">
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.title} (${year})</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Function to Update Pagination UI
    function renderPagination() {
      const pageNumbers = document.getElementById('page-numbers');
      const pageStatus = document.getElementById('page-status');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      pageNumbers.innerHTML = '';
      pageStatus.innerText = `Page ${currentPage} of ${totalPages}`;

      // Disable/Enable Prev & Next Buttons
      prevBtn.classList.toggle('disabled', currentPage === 1);
      nextBtn.classList.toggle('disabled', currentPage === totalPages);

      let startPage = Math.max(1, currentPage - 1);
      let endPage = Math.min(totalPages, currentPage + 1);

      if (currentPage === 1) endPage = Math.min(totalPages, 3);
      if (currentPage === totalPages) startPage = Math.max(1, totalPages - 2);

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => changePage(i);
        pageNumbers.appendChild(btn);
      }
    }

    // Handle Page Change
    function changePage(newPage) {
      if (newPage < 1 || newPage > totalPages || newPage === currentPage) return;
      currentPage = newPage;
      renderPagination();
      fetchMovies(currentPage);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', () => {
      renderPagination();
      fetchMovies(currentPage);
    });
  </script>
</body>
</html>
