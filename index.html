<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies World</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Google Translate Dropdown Styling */
    #google_translate_element {
      display: inline-block;
      margin: 10px;
    }
    .goog-te-gadget-simple {
      background-color: #1a1a1a !important;
      border: 1px solid #333 !important;
      padding: 6px 12px !important;
      border-radius: 6px !important;
      color: #fff !important;
      font-size: 14px !important;
    }
    .goog-te-gadget-simple span {
      color: #fff !important;
    }
    .goog-te-banner-frame {
      display: none !important;
    }
    body {
      top: 0px !important;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="nav-container">
      <h1 class="logo">Movies World</h1>
      
      <!-- Google Translate Button Placement -->
      <div id="google_translate_element"></div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app">
    <!-- Movies will be loaded dynamically by api.js -->
  </main>

  <!-- External JavaScript Files -->
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>

  <!-- Google Translate Integration Script -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'si,en,ta,hi',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
