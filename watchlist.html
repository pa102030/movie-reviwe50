<!-- Login / Signup Modal with Social Logins -->
<div id="auth-modal">
  <div class="auth-box">
    <h3 id="auth-modal-title">Sign In to MOVIES WORLD</h3>
    <div id="auth-error"></div>

    <!-- Social Login Buttons -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
      <button onclick="socialLogin('Google')" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; background: #fff; color: #333; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
      </button>
      <button onclick="socialLogin('Facebook')" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; background: #1877f2; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">
        <i class="fa-brands fa-facebook-f"></i> Continue with Facebook
      </button>
      <button onclick="socialLogin('Twitter')" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px; background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;">
        <i class="fa-brands fa-x-twitter"></i> Continue with X (Twitter)
      </button>
    </div>

    <div style="display: flex; align-items: center; text-align: center; margin-bottom: 20px; color: #666;">
      <div style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
      <span style="padding: 0 10px; font-size: 12px; text-transform: uppercase;">Or with email</span>
      <div style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
    </div>

    <div class="auth-field" id="auth-name-group" style="display:none;">
      <label>Your Name</label>
      <input type="text" id="auth-name-input" placeholder="Enter your name">
    </div>

    <div class="auth-field">
      <label>Email Address</label>
      <input type="email" id="auth-email-input" placeholder="name@example.com">
    </div>

    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="auth-password-input" placeholder="••••••••">
    </div>

    <button class="auth-btn" id="auth-submit-btn" onclick="submitAuthForm()">Sign In</button>

    <p class="auth-footer-text">
      <span id="auth-toggle-label">Don't have an account?</span> 
      <a href="#" onclick="toggleAuthMode(); return false;" id="auth-toggle-link">Sign Up</a>
    </p>

    <button class="auth-close-btn" onclick="closeAuthModal()">Cancel</button>
  </div>
</div>
