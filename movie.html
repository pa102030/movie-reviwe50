<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Movie Details - MOVIES WORLD</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Preloader Section -->
  <div id="preloader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0d12; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:99999; transition: opacity 0.4s ease;">
    <div style="width:50px; height:50px; border:4px solid rgba(255,255,255,0.1); border-top:4px solid #e50914; border-radius:50%; animation: spin 1s linear infinite;"></div>
    <h3 style="color:#fff; margin-top:15px; font-size:16px; letter-spacing:2px;">MOVIES WORLD</h3>
  </div>

  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark"><i class="fa-solid fa-clapperboard"></i></span>
        MOVIES<b>WORLD</b>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="reviews.html">Reviews</a>
        <a href="watchlist.html">Watchlist</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-open-search><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" data-theme-toggle><i class="fa-solid fa-circle-half-stroke"></i></button>
      </div>
    </div>
  </header>

  <main id="main" style="max-width: 1100px; margin: 40px auto; padding: 0 20px; min-height: 70vh;">
    <div id="movie-details-container">
      <p style="text-align:center; color:#94a3b8; padding:50px;"><i class="fa-solid fa-spinner fa-spin"></i> Fetching details...</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner" style="text-align:center; padding:20px; color:#94a3b8; font-size:14px;">
      <p>© 2026 MOVIES WORLD. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
