<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <title>Movie Details - MOVIES WORLD</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e50914'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>M</text></svg>">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark"><i class="fa-solid fa-clapperboard"></i></span>
        MOVIES<b>WORLD</b>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="reviews.html">Reviews</a>
        <a href="genres.html">Genres</a>
        <a href="watchlist.html">Watchlist</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-open-search aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
      </div>
    </div>
  </header>

  <main id="main" style="max-width: 1100px; margin: 40px auto; padding: 0 20px;">
    <div id="movie-details-container">
      <p style="text-align:center; color:#94a3b8; padding:50px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading details...</p>
    </div>
  </main>

  <!-- Live Search Modal -->
  <div id="search-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,13,18,0.95); z-index:9999; justify-content:center; align-items:flex-start; padding-top:60px; overflow-y:auto;">
    <div style="width:90%; max-width:900px; background:#121721; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; position:relative;">
      <button id="close-search" style="position:absolute; top:20px; right:20px; background:none; border:none; color:#f8fafc; font-size:24px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      <h3 style="color:#f8fafc; margin-bottom:20px;"><i class="fa-solid fa-magnifying-glass" style="color:#e50914;"></i> Search Movies</h3>
      <input type="text" id="search-input" placeholder="Type movie title..." style="width:100%; padding:14px 18px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#fff; font-size:16px; outline:none; margin-bottom:24px;">
      <div id="search-results-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px;">
        <p style="color:#94a3b8; text-align:center; grid-column:1/-1;">Type at least 2 characters to search...</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner" style="text-align:center; padding:20px; color:#94a3b8; font-size:14px;">
      <p>© 2026 MOVIES WORLD. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
